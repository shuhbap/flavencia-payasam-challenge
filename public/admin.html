<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin · Payasam Challenge</title><link rel="stylesheet" href="style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head><body>
<header><span class="logo"><i></i>Payasam Admin</span><nav><a href="#" id="lo" hidden>Logout</a></nav></header><main>
<form class="card" id="lf"><h2>Admin login</h2><label>Email<input name="e" type="email" required></label><label>Password<input name="p" type="password" required></label><button class="alt">Log in</button></form>
<div id="app" hidden><div class="grid" id="st"></div>
<form class="card" id="sf"><h3>Settings and Payment Settings</h3><div class="row"><label>Price per litre (₹)<input name="pricePerLitre" type="number" step="0.01" min="0.01" required></label><label>UPI ID / VPA<input name="upiId"></label><label>Payee name<input name="payeeName"></label><label>Payment instructions<input name="paymentInstructions"></label><label>Default team ranking<select name="defaultTeamRanking"><option value="orders">Orders</option><option value="litres">Litres</option><option value="sales">Sales</option></select></label><label>Default individual ranking<select name="defaultIndividualRanking"><option value="orders">Orders</option><option value="litres">Litres</option><option value="sales">Sales</option></select></label></div><label><input type="checkbox" name="upiEnabled" style="width:auto"> Enable UPI payments</label><button class="alt">Save settings</button><div id="qp"></div></form>
<div class="card"><h3>Teams</h3><div class="tw"><table id="tt"></table></div></div>
<div class="card"><h3>Orders</h3><div class="row"><input id="q" placeholder="Search ID, customer, phone, C/O"><select id="ft"><option value="">All teams</option></select><select id="fm"><option value="">Any method</option><option>Cash</option><option>UPI</option><option>Pending</option></select><select id="fp"><option value="">Any payment status</option><option>Pending</option><option>Pending Verification</option><option>Partially Paid</option><option>Paid</option><option>Refunded</option></select><select id="fo"><option value="">Any order status</option><option>New</option><option>Confirmed</option><option>Delivered</option><option>Cancelled</option></select><input id="d1" type="date" aria-label="From date"><input id="d2" type="date" aria-label="To date"></div>
<div class="tw"><table id="ot"></table></div></div>
<div class="card"><h3>Reports (CSV)</h3><select id="rp"></select><button class="alt" id="ex">Export CSV</button></div></div></main><script type="module" src="admin.js"></script></body></html>
